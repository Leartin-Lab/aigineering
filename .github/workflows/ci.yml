name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/aigineering tests
      - name: Format check
        run: ruff format --check src/aigineering tests
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
