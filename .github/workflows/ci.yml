name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AIG_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,api,redis]"
      - name: Lint
        run: ruff check src/aigineering tests scripts
      - name: Format check
        run: ruff format --check src/aigineering tests scripts
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  installed-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Python 3.11 distribution
        uses: actions/download-artifact@v4
        with:
          name: dist-python-3.11
          path: dist
      - name: Run installed-wheel smoke test
        run: |
          python scripts/installed_smoke.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --expected-version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" \
            --source-root "$GITHUB_WORKSPACE" \
            --evidence-dir "$RUNNER_TEMP/reconstruction-evidence"
      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-evidence-python-3.11-${{ github.run_id }}
          path: ${{ runner.temp }}/reconstruction-evidence
          if-no-files-found: warn
