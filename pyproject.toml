[project]
name = "aigineering"
version = "0.5.0"
description = "Agent Runtime — structural hallucination containment for LLM-based agents"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Aigineering Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
]
keywords = ["ai", "agents", "runtime", "hallucination", "zero-trust", "llm"]
dependencies = [
    "click>=8.0",
    "cryptography>=43",
]

[project.scripts]
aig = "aigineering.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigineering"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/**",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "build>=1.2", "twine>=5.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "stress: stress tests that create many contracts and verify at scale",
]
