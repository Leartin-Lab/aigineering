[project]
name = "aigineering"
version = "0.5.14"
description = "Zero Trust agent runtime for auditable AI-assisted engineering and research."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Aigineering Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
]
keywords = ["ai", "agents", "runtime", "hallucination", "zero-trust", "llm"]
dependencies = [
    "click>=8.0",
    "cryptography>=43",
    "redis>=5.0",
]

[project.scripts]
aig = "aigineering.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigineering"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/aigineering/**",
    "/examples/**",
    "/docs/**",
    "/conformance/**",
    "/changes/**",
    "/reports/**",
    "/scripts/**",
    "/README.md",
    "/README.zh-CN.md",
    "/DESIGN.md",
    "/ROADMAP.md",
    "/SKILL.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
    "/compose.yaml",
]
exclude = [
    "tests/**",
    "**/.env",
    "**/.env.*",
]

[project.optional-dependencies]
documents = ["pymupdf>=1.24.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff==0.15.17", "build>=1.2", "twine>=5.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27"]
redis = ["redis>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "stress: stress tests that create many contracts and verify at scale",
]
