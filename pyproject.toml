[project]
name = "aigineering"
version = "0.4.10"
description = "Agent Runtime — structural hallucination containment for LLM-based agents"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Aigineering Contributors" },
]
dependencies = [
    "click>=8.0",
]

[project.scripts]
aig = "aigineering.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigineering"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "build>=1.2"]
crypto = ["cryptography>=43"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "stress: stress tests that create many contracts and verify at scale",
]
